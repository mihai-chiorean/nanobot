[Service]
Environment="GRAFANA_CLOUD_OTLP_ENDPOINT=https://otlp-gateway-prod-us-west-0.grafana.net/otlp"
Environment="GRAFANA_CLOUD_INSTANCE_ID=1731821"
LoadCredential=grafana-cloud-api-key:/etc/ziggy/secrets/grafana-cloud-otel-token
ExecStart=
ExecStart=/usr/local/libexec/ziggy-otelcol-start --config=/etc/otelcol-contrib/config.yaml
Restart=on-failure
RestartSec=10s
MemoryMax=448M
CPUQuota=15%
NoNewPrivileges=true
PrivateTmp=true

