receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318

  hostmetrics:
    collection_interval: 60s
    scrapers:
      cpu:
        metrics:
          system.cpu.logical.count:
            enabled: true
          system.cpu.utilization:
            enabled: true
      disk: {}
      filesystem:
        exclude_mount_points:
          mount_points:
            - /dev/*
            - /proc/*
            - /sys/*
            - /run/*
            - /var/lib/docker/*
          match_type: regexp
        exclude_fs_types:
          fs_types:
            - autofs
            - bpf
            - cgroup2
            - configfs
            - debugfs
            - devpts
            - devtmpfs
            - fusectl
            - overlay
            - proc
            - pstore
            - securityfs
            - squashfs
            - sysfs
            - tmpfs
            - tracefs
          match_type: strict
      load: {}
      memory:
        metrics:
          system.memory.limit:
            enabled: true
          system.memory.utilization:
            enabled: true
      network: {}
      paging: {}
      system:
        metrics:
          system.uptime:
            enabled: true

  httpcheck/model_stack:
    collection_interval: 30s
    metrics:
      httpcheck.duration:
        enabled: true
    targets:
      - endpoint: http://127.0.0.1:8012/health
      - endpoint: http://127.0.0.1:8001/health
      # Nanobot is intentionally bound to Spark's Tailscale address, not loopback.
      - endpoint: http://spark-094a.tail6faf85.ts.net:18792/health

  prometheus/qwen:
    config:
      scrape_configs:
        - job_name: qwen-vllm
          scrape_interval: 30s
          metrics_path: /metrics
          static_configs:
            - targets: [127.0.0.1:8012]

  journald/ziggy_lifecycle:
    start_at: end
    priority: info
    identifiers: [systemd]
    grep: '(?i)(((qwen-vllm|anti-sycophancy-proxy|nanobot-gateway|whisper|ziggy-ingest|minimax).*(started|stopped|starting|stopping|failed|main process exited|scheduled restart))|((started|stopped|starting|stopping|failed|main process exited|scheduled restart).*(qwen-vllm|anti-sycophancy-proxy|nanobot-gateway|whisper|ziggy-ingest|minimax)))'

  journald/kernel:
    start_at: end
    priority: warning
    dmesg: true
    grep: '(?i)(out of memory|oom-kill|killed process|nvrm|xid|cuda|gpu|nvme|i/o error|filesystem)'

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 160
    spike_limit_mib: 32

  batch:
    send_batch_size: 256
    timeout: 15s

  resourcedetection:
    detectors: [env, system]
    system:
      resource_attributes:
        host.id:
          enabled: true
        host.name:
          enabled: true

  resource/ziggy:
    attributes:
      - key: deployment.environment
        value: production
        action: upsert
      - key: service.namespace
        value: ziggy
        action: upsert
      - key: ziggy.host.role
        value: spark
        action: upsert

  transform/promote_host:
    metric_statements:
      - set(datapoint.attributes["host.name"], resource.attributes["host.name"])

  transform/journald:
    error_mode: ignore
    log_statements:
      - set(log.attributes, log.body)
      - set(log.body, log.body["MESSAGE"])
      - set(resource.attributes["service.name"], log.attributes["_SYSTEMD_USER_UNIT"]) where log.attributes["_SYSTEMD_USER_UNIT"] != nil
      - set(resource.attributes["service.name"], log.attributes["_SYSTEMD_UNIT"]) where resource.attributes["service.name"] == nil and log.attributes["_SYSTEMD_UNIT"] != nil
      - set(resource.attributes["service.name"], log.attributes["SYSLOG_IDENTIFIER"]) where resource.attributes["service.name"] == nil
      - keep_keys(log.attributes, ["PRIORITY", "_SYSTEMD_UNIT", "_SYSTEMD_USER_UNIT", "SYSLOG_IDENTIFIER", "_BOOT_ID"])

exporters:
  otlphttp/grafana_cloud:
    endpoint: ${env:GRAFANA_CLOUD_OTLP_ENDPOINT}
    auth:
      authenticator: basicauth/grafana_cloud
    sending_queue:
      enabled: true
      num_consumers: 1
      queue_size: 64
    retry_on_failure:
      enabled: true
      max_elapsed_time: 2m

extensions:
  basicauth/grafana_cloud:
    client_auth:
      username: ${env:GRAFANA_CLOUD_INSTANCE_ID}
      password: ${env:GRAFANA_CLOUD_API_KEY}

service:
  extensions: [basicauth/grafana_cloud]
  pipelines:
    metrics:
      receivers: [otlp, hostmetrics, httpcheck/model_stack, prometheus/qwen]
      processors: [memory_limiter, resourcedetection, resource/ziggy, transform/promote_host, batch]
      exporters: [otlphttp/grafana_cloud]
    logs:
      receivers: [journald/ziggy_lifecycle, journald/kernel]
      processors: [memory_limiter, transform/journald, resourcedetection, resource/ziggy, batch]
      exporters: [otlphttp/grafana_cloud]
  telemetry:
    resource:
      service.name: ziggy-otelcol
      host.name: ${env:HOSTNAME}
    metrics:
      readers:
        - periodic:
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: ${env:GRAFANA_CLOUD_OTLP_ENDPOINT}/v1/metrics
                headers:
                  - name: authorization
                    value: ${env:GRAFANA_CLOUD_BASIC_AUTH_HEADER}
