[Service]
# Spark already reserves 127.0.0.1:8787 for linear-agent-host.
# Environment files override Environment= assignments regardless of drop-in
# ordering, so append a Spark-specific environment file after the base file.
EnvironmentFile=
EnvironmentFile=/etc/ziggy/ziggy-control.env
EnvironmentFile=/etc/ziggy/ziggy-control-spark.env
