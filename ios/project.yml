name: Ziggy

options:
  bundleIdPrefix: com.mihaichiorean
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios.git
    from: 1.3.2
  Textual:
    url: https://github.com/gonzalezreal/textual.git
    from: 0.5.0

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    DEVELOPMENT_TEAM: 98KW2QQ963
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: true
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  Ziggy:
    type: application
    platform: iOS
    sources:
      - path: Ziggy
    dependencies:
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
      - package: Textual
        product: Textual
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mihaichiorean.ziggy
        PRODUCT_NAME: Ziggy
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Ziggy/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Ziggy
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Ziggy uses the microphone when you dictate a prompt.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Ziggy transcribes dictated prompts on your device.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Ziggy lets you attach selected images to a conversation.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
    scheme:
      testTargets:
        - ZiggyTests

  ZiggyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ZiggyTests
    dependencies:
      - target: Ziggy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mihaichiorean.ziggy.tests
        GENERATE_INFOPLIST_FILE: true

  ZiggyLiveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ZiggyLiveUITests
    dependencies:
      - target: Ziggy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mihaichiorean.ziggy.live-ui-tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  Ziggy:
    build:
      targets:
        Ziggy: all
        ZiggyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ZiggyTests
    archive:
      config: Release

  ZiggyLive:
    build:
      targets:
        Ziggy: all
        ZiggyLiveUITests: [test]
    test:
      config: Debug
      targets:
        - ZiggyLiveUITests
      environmentVariables:
        ZIGGY_LIVE_SESSION_READY: "$(ZIGGY_LIVE_SESSION_READY)"
        ZIGGY_SERVER_URL: "$(ZIGGY_SERVER_URL)"
        ZIGGY_THEME: "$(ZIGGY_THEME)"
